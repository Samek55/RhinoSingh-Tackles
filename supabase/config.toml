# Called by a Supabase Database Webhook (its own x-zoho-sync-secret header is
# the real gate) and by manual retry with a staff session token — the webhook
# path's own JWT behavior hasn't been independently confirmed, so this stays
# off rather than risk a regression there. Everything else that moved from
# Firebase-token auth to the admin_sessions x-admin-session-token header no
# longer needs this override, since Authorization is free again for
# Supabase's own anon-key check.
[functions.zoho-invoice-sync]
verify_jwt = false
