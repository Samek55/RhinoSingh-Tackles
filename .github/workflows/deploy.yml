name: CI/CD - Test and Deploy to Google Play

on:
  push:
    branches:
      - main # Change to your default branch if different (e.g., master)

jobs:
  test:
    name: Run Tests & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test -- --ci --watchAll=false
        # Adjust the test command above to match how your project runs tests (e.g., npx jest)

  deploy-internal:
    name: Build and Push to Google Play (Internal)
    needs: test # This ensures deployment ONLY runs if the 'test' job succeeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Build Android App Bundle (AAB) via EAS
        run: eas build --platform android --profile production --non-interactive

      - name: Submit to Google Play Internal Testing
        run: eas submit --platform android --auto-submit --non-interactive